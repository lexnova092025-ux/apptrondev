<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="title">
  <title id="title">Apptrondev logo</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#6a5af9" />
      <stop offset="100%" stop-color="#f03b9f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(24,24)" filter="url(#shadow)">
    <!-- stylized A mark -->
    <path d="M40 140 L80 26 L160 26 L200 140 L160 140 L132 75 L108 75 L80 140 Z" fill="url(#g1)" />
  </g>

  <g transform="translate(240,60)">
    <text x="0" y="30" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#ffffff">apptron</text>
    <text x="0" y="78" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b9c2cc">dev</text>
  </g>
</svg>